# Third-party plugin corpus — 13 repositories, 156 plugin roots.
#
# Plugins nobody in this repository authored, pinned by commit. They exist to
# answer a question this repository's own fixtures structurally cannot: not
# "does claudevs do what we intended?" but "was what we intended right?".
# `tests/fixtures/` holds four plugins written here, by the same hand as the
# code they exercise, so they encode the same assumptions and cannot disconfirm
# them. Every plugin below was written by someone who had never heard of
# claudevs.
#
# Cloned and swept on 2026-08-29 with `claudevs check` built from `main` at
# 2db55e4. That sweep is the source of every corpus number in
# `.claudestacks/sdlc/2026-08-29-claudevs-plugin-correctness/`: 43 of 156 roots
# failing with only 3 genuine, 34 `refs` errors partitioning 29/3/1/1, and 77
# dead-file warnings partitioning 40/26/5/5. Without this file those numbers are
# unreproducible, because nothing else records which repositories at which
# commits produced them.
#
# The `sha` values are what was actually measured — `git rev-parse HEAD` in each
# `git clone --depth 1` at sweep time. Re-fetching one is
# `git fetch --depth 1 origin <sha>`, which GitHub serves for a reachable commit.
# That is not a guarantee: a repository can be deleted, made private, or
# force-pushed, and then its row becomes a record of what was tested rather than
# something re-runnable. Spot-checked at write time — `anthropics/claude-code`
# HEAD still resolves to the pinned commit.
#
# `plugins` holds paths relative to the repository root. "." means the
# repository root is itself the plugin, which is true for three of the thirteen.
# A path here is a plugin root: a directory containing `.claude-plugin/`.
#
# This file is data, not a test. Nothing reads it yet.

