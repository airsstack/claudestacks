[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app. Shell only: claudevs runs on Unix, not Windows.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax): macOS and Linux on
# both architectures, and a musl build of each Linux one for systems without glibc.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
# Not CARGO_HOME: the prebuilt binary exists for engineers who have no Rust toolchain,
# and a ~/.cargo/bin appearing on such a machine would be a surprise.
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Only `claudevs-cli` tags (such as `claudevs-cli-v0.1.0`) start a release. The workspace
# also tags `airsclaude` and `claudevs`, which have no binary to ship, and dist fails its
# plan step on such a tag.
tag-namespace = "claudevs-cli"
# A checksum file can be swapped alongside the binary it describes; an attestation
# ties each archive's digest to this repository, commit and workflow.
github-attestations = true
# dist builds and publishes but never runs what it built. This hook runs after
# every archive is built and `host` waits for it, so an archive that fails its
# smoke test is never published. See .github/workflows/claudevs-cli-smoke.yml.
global-artifacts-jobs = ["./claudevs-cli-smoke"]
# Pull requests build and smoke-test every archive too, publishing nothing. The
# gate in ci.yml never builds musl or this profile, so without this a change that
# breaks a release target would first fail on the release tag itself.
pr-run-mode = "upload"

# GitHub retires every macOS 14 image on November 2, 2026, and dist's default runner for
# aarch64-apple-darwin is macos-14. macos-15 is the arm64 label. Do not copy this file
# from a sibling repository without keeping this entry.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
