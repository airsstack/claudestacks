[package]
name        = "claudevs-cli"
description = "Command-line interface for claudevs, the Claude Code plugin lifecycle tool"
version     = "0.1.0"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

readme     = "README.md"
keywords   = ["claude-code", "claude", "plugin", "testing", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "claudevs"
path = "src/main.rs"
doc  = false

[lints]
workspace = true

[dependencies]
claudevs = { workspace = true }
clap     = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
serde_json = { workspace = true }
