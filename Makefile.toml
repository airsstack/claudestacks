#
# cargo-make task graph for the claudestacks workspace.
#
#   cargo make            # the full Definition-of-Done gate
#   cargo make fmt        # rewrite formatting (the only task that mutates the tree)
#   cargo make clippy     # a single gate step
#   cargo make --list-all-steps
#
# The five gate steps mirror the canonical command set in the
# `claudestacks-guideline-rust` plugin one-for-one. Change them there first; this
# file follows. CI runs `cargo make dod`, so the pipeline and a local run are
# the same command.
#
# Install: cargo install --locked cargo-make
#

[config]
# Every gate command already carries `--workspace`, so the task must run exactly
# once from the workspace root. Without this, cargo-make re-runs each task once
# per member crate — five redundant full-workspace builds.
default_to_workspace = false
# No implicit task graph. The gate is only what is written below, and a
# built-in `build`/`test`/`ci-flow` inherited from cargo-make's core set would
# run cargo commands nobody in this repo chose.
skip_core_tasks = true
min_version = "0.37.0"

[env]
CARGO_TERM_COLOR = "always"

# `--all-features` below is carried for forward-safety: no crate in this
# workspace declares Cargo `[features]`, so today it equals the default build.
# It stays in every command so the gate stays correct the day a feature is added.

# ---------------------------------------------------------------------------
# The gate
# ---------------------------------------------------------------------------

[tasks.default]
alias = "dod"

[tasks.dod]
category = "Gate"
description = "Definition of Done — every step must exit 0 with zero warnings"
dependencies = ["fmt-check", "clippy", "doc", "test", "test-doc"]

[tasks.fmt-check]
category = "Gate"
description = "Assert formatting without rewriting anything"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
category = "Gate"
description = "Lint every target, warnings are errors"
# `--all-targets` covers tests, examples and benches — a lint living only in
# test code passes silently without it. `-D warnings` also promotes plain rustc
# warnings, which is why the gate has no separate `cargo build` step.
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]

[tasks.doc]
category = "Gate"
description = "Build rustdoc with warnings promoted to errors"
# Plain `cargo doc` prints rustdoc warnings and still exits 0; RUSTDOCFLAGS is
# the only thing that makes this step a gate rather than a report.
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps"]

[tasks.doc.env]
RUSTDOCFLAGS = "-D warnings"

[tasks.test]
category = "Gate"
description = "Unit, integration, example and bench targets"
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--all-features"]

[tasks.test-doc]
category = "Gate"
description = "Doctests — excluded by --all-targets, so they need their own run"
command = "cargo"
args = ["test", "--workspace", "--all-features", "--doc"]

# ---------------------------------------------------------------------------
# Supply chain
# ---------------------------------------------------------------------------

[tasks.deny]
category = "Supply chain"
description = "cargo-deny: security advisories, licenses, duplicate versions, sources"
# Deliberately not a dependency of `dod`. The Definition of Done is the five
# commands the guideline skill owns; adding a sixth here would make this file
# disagree with its source of truth. This check also answers to a moving
# advisory database rather than to the working tree, so it can fail on a commit
# that changed nothing.
command = "cargo"
args = ["deny", "check"]

# ---------------------------------------------------------------------------
# The plugin suite
# ---------------------------------------------------------------------------

[tasks.plugins]
category = "Plugin suite"
description = "Every check over the Lua plugin scripts"
# Deliberately not a dependency of `dod`, for the same reason `deny` is not: the
# Definition of Done is the five commands the guideline skill owns, and a sixth
# here would make this file disagree with its source of truth. It also needs the
# `airsl` binary installed rather than only the workspace built, which is a
# different prerequisite from every gate step.
dependencies = ["plugins-check", "plugins-test"]

[tasks.plugins-check]
category = "Plugin suite"
description = "Compile every Lua file, including the ones no test loads"
# Runs before the tests because it is cheaper and its failures are more
# fundamental: `airsl test` only compiles what a test file loads, and a hook's
# entry point is loaded by nothing. Before this existed, a missing `end` in the
# enforcement dispatcher left the suite at 177 passing and the hook exiting 0 —
# silent at both ends.
#
# No policy and no grants: nothing is executed, so there is no authority to grant.
script_runner = "@shell"
script = '''
set -e
if ! command -v airsl >/dev/null 2>&1; then
    echo "airsl is not installed: cargo make install-airsl" >&2
    exit 1
fi
set -x
airsl check plugins
'''

[tasks.plugins-test]
category = "Plugin suite"
description = "airsl test over the Lua plugin scripts"
# The grants are what the scripts actually need to run their own tests: read
# anywhere (a test builds fixtures under the system temp directory and reads
# repository files), write only under that temp directory, and `git` as the one
# program they may run.
script_runner = "@shell"
script = '''
set -e
if ! command -v airsl >/dev/null 2>&1; then
    echo "airsl is not installed: cargo make install-airsl" >&2
    exit 1
fi
set -x
airsl test --policy confined \
  --allow-read / \
  --allow-write "${TMPDIR:-/tmp}" \
  --allow-exec git \
  plugins
'''

[tasks.claudevs-check]
category = "Plugin suite"
description = "claudevs check over the fixture plugin corpus, both directions"
# Not a dependency of `dod` for the same reason `plugins` is not: the gate is
# the five commands the guideline skill owns. This lane asserts the checkers
# still report — a corpus of only-passing fixtures would go green the day they
# stopped. `claude` is absent on the runner, so the validate stage skips and
# the deterministic stages carry the gate, which is the documented degradation.
#
# `claude plugin validate`, run without `--strict` (the CLI's own default),
# still rejects bad-matcher-plugin on a machine that has `claude` installed:
# exit 1, "hooks.PreToolUseX: Invalid key in record". A failing stage no
# longer stops the run, so the wiring stage runs right after it and reports
# its own FAIL for the same fixture — both FAIL lines show up in one report.
# On the CI runner, where `claude` is absent, validate reports itself skipped
# and wiring's FAIL is the only one produced. Either way wiring FAILs, and
# that is the stage this lane asserts — so the deterministic wiring checkers
# are exercised here and on CI alike, and a local pass is evidence for both.
#
# wiring's FAIL is now carried by `refs`, not `matchers`: the fixture's unknown
# hook event and unparseable matcher regex are both warnings (a documented
# event claudevs' catalogue may lag, and a matcher divergence claudevs cannot
# prove the runtime would also reject), and a warning never fails a stage
# (crates/claudevs/src/wiring/finding.rs). The fixture's `hooks.json` command
# also references `${CLAUDE_PLUGIN_ROOT}/scripts/absent.sh`, a script that does
# not exist — a genuine `refs` error — so wiring still FAILs for a reason that
# is really a defect, on every machine.
#
# `root` is deliberately relative: `claudevs check` resolves `plugin_dir` to
# an absolute path once, up front, and uses that single value for both the
# spawned delegate's argv and its cwd (crates/claudevs/src/validate.rs), so a
# relative path here is no longer doubled. Keeping it relative means that on
# a machine that has `claude`, this lane also exercises the delegate's path
# handling, so that defect cannot come back unnoticed.
script_runner = "@shell"
script = '''
set -e
root="crates/claudevs/tests/fixtures"

# `cargo run -q -p claudevs-cli --` in place of a hardcoded `target/debug/claudevs`
# path: cargo resolves the target directory itself, so the lane still works under
# CARGO_TARGET_DIR or a --target-dir override. `-q` suppresses cargo's own build
# output, so the captured output below is exactly what `claudevs check` printed.
#
# `_run` captures output and exit code and asserts the exit code, but is
# private (leading underscore, never called from the fixture list below) so
# that the stage assertion always runs in the same breath as the capture —
# there is no exposed "run" step whose output an assertion could read stale
# after a previous fixture, because there is no way to call one without the
# other.
_run() {
    plugin="$1"; want_exit="$2"
    set +e
    out="$(cargo run -q -p claudevs-cli -- check "$root/$plugin" 2>&1)"
    got=$?
    set -e
    if [ "$got" != "$want_exit" ]; then
        echo "claudevs check $plugin: expected exit $want_exit, got $got" >&2
        echo "$out" >&2
        exit 1
    fi
}

# Asserting exit codes alone cannot tell which stage produced them: a
# regression that fails the wiring check for the wrong reason, or that moves a
# failure from wiring to validate, keeps exit 1 and this lane would stay
# green. So beyond the exit code, assert which stage line `claudevs check`
# printed.

# `claudevs check` indents every top-level stage line by two spaces (`  ok
# validate`, `  FAIL  wiring`), so the assertions below match on that exact
# prefix rather than column zero.
#
# Each fixture calls exactly one of the three functions below, and each one
# runs `_run` itself before reading `$out`/`$got` — the two can no longer be
# invoked separately, so there is no way to assert against a previous
# fixture's stale output.
expect_no_fail() {
    plugin="$1"; want_exit="$2"
    _run "$plugin" "$want_exit"
    if echo "$out" | grep -q "^  FAIL  "; then
        echo "claudevs check $plugin: expected every stage to pass, but a stage reported FAIL:" >&2
        echo "$out" >&2
        exit 1
    fi
    # The absence check above cannot tell "every stage passed" from "no stage
    # line was printed at all" — a silently-broken binary that exits 0 with no
    # output would sail through it. `wiring` is the positive anchor because it
    # runs on every machine regardless of whether the `claude` binary is
    # installed (unlike `validate`, which skips when `claude` is absent), so
    # asserting its exact line pins that a stage was actually produced without
    # reintroducing any machine dependence.
    if ! echo "$out" | grep -q "^  ok    wiring\$"; then
        echo "claudevs check $plugin: expected \"ok    wiring\" among the stage lines, got:" >&2
        echo "$out" >&2
        exit 1
    fi
    echo "ok  $plugin (exit $got, no stage failed)"
}

expect_stage_fail() {
    plugin="$1"; want_exit="$2"; stage="$3"
    _run "$plugin" "$want_exit"
    if ! echo "$out" | grep -q "^  FAIL  $stage\$"; then
        echo "claudevs check $plugin: expected \"FAIL  $stage\", got:" >&2
        echo "$out" >&2
        exit 1
    fi
    echo "ok  $plugin (FAIL $stage)"
}

# bad-matcher-plugin FAILs at wiring on every machine: the wiring checkers are
# native and run whether or not `claude` is installed. Where `claude` IS
# installed the validate stage FAILs too, and since a failing stage no longer
# stops the run, both FAIL lines land in one report. `expect_stage_fail` greps
# for its own stage's line rather than requiring it to be the only FAIL, so
# pinning `wiring` here holds in both environments — and, unlike accepting
# "validate or wiring", it still fails this lane if the matcher checker ever
# stops reporting.

expect_no_fail minimal-plugin 0
expect_no_fail dead-script-plugin 0
expect_stage_fail escape-plugin 1 wiring
expect_stage_fail bad-matcher-plugin 1 wiring

# project-branch-plugin is the paired control for the default project: its
# one PreToolUse hook only speaks when the payload names a file that exists
# inside a project carrying a manifest, which is exactly what the default
# fixtureless project (Project::empty()) now provides. A bare temp directory
# would take the hook's silent branch and this case would pass whether the
# hook worked or not.
expect_no_fail project-branch-plugin 0

# exec-args-plugin is the paired control for `args`-carrying exec handlers: one
# SessionStart case whose output comes from `command`, one whose output comes
# only from `args`. Both must pass, or the exec dispatch path has regressed.
expect_no_fail exec-args-plugin 0

# matcher-routing-plugin is a must-fail fixture on purpose: its two PreToolUse
# cases target different matcher groups, and the second asserts the `Edit`
# group's output against a `Bash` payload — a case the runtime would never
# route there. It FAILs at `test` (and `test --installed`, for the same
# reason): both stages actually run the case suite, unlike `wiring`, which is
# static and cannot see a payload/matcher mismatch. A corpus of only-passing
# fixtures would go green the day this routing check stopped reporting.
expect_stage_fail matcher-routing-plugin 1 test
'''

[tasks.corpus-fetch]
category = "Plugin suite"
description = "Clone the pinned third-party plugin corpus into target/corpus"
# The only step in this repository that touches the network. It is never a
# dependency of `dod`, never runs in CI, and is run before a release rather
# than on every commit — the corpus is pinned by commit SHA rather than
# vendored, which keeps repository weight at zero (vendoring measured 19 MB
# for all 156 roots) and keeps the published .crate clear of the crates.io
# size ceiling. The cost of that choice is exactly this: a check nobody is
# obliged to run guards by convention.
#
# A pinned SHA is re-fetchable while the commit stays reachable. A repository
# that is deleted, made private, or force-pushed makes its row a record of
# what was tested rather than something re-runnable. That is expected; report
# such a row as unfetchable rather than repinning it silently.
script_runner = "@shell"
script = '''
set -eu
manifest="crates/claudevs/tests/corpus/corpus.toml"
dest="target/corpus"
log="$dest/.fetch-log"
unfetchable="$dest/.unfetchable"

# Stale markers from a previous, possibly-interrupted run must not vouch for
# this one. `dest` itself is created lazily below, only once there is
# something to write into it, so a run that clones nothing leaves no
# directory behind for `corpus_root()` (tests/corpus.rs) to find.
rm -f "$log" "$unfetchable"

# There is no TOML parser in the shell, and the manifest does not need one:
# every [[repo]] block carries name, url and sha on their own lines, in that
# order, because the generator that wrote the file emits exactly that shape.
# awk reduces it to `name<TAB>url<TAB>sha` and the loop below does the rest.
awk -F'"' '
  /^name = "/ { name = $2 }
  /^url = "/  { url  = $2 }
  /^sha = "/  { print name "\t" url "\t" $2 }
' "$manifest" | while IFS="$(printf '\t')" read -r name url sha; do
  mkdir -p "$dest"
  slug=$(printf '%s' "$name" | tr '/' '_')
  repo="$dest/$slug"

  if [ -d "$repo/.git" ] && [ "$(git -C "$repo" rev-parse HEAD 2>/dev/null)" = "$sha" ]; then
    printf 'ok    %s @ %s\n' "$name" "$sha"
    printf '%s\n' "$name" >> "$log"
    continue
  fi

  rm -rf "$repo"
  mkdir -p "$repo"
  git -C "$repo" init -q
  git -C "$repo" remote add origin "$url"
  # A pinned SHA is fetchable directly while the commit stays reachable. A
  # repository that was deleted, made private, or force-pushed fails here,
  # and that is the honest outcome: its row records what was tested rather
  # than something re-runnable. Report it; do not repin it.
  if git -C "$repo" fetch -q --depth 1 origin "$sha" 2>/dev/null; then
    git -C "$repo" checkout -q FETCH_HEAD
    printf 'fetched %s @ %s\n' "$name" "$sha"
    printf '%s\n' "$name" >> "$log"
  else
    printf 'UNFETCHABLE %s @ %s (deleted, private, or force-pushed)\n' "$name" "$sha" >&2
    rm -rf "$repo"
    printf '%s\n' "$name" >> "$log"
    printf '%s\n' "$slug" >> "$unfetchable"
  fi
done

# `read`'s while loop above runs in a pipeline, so a POSIX shell forks it into
# a subshell and any counter set inside it vanishes when the loop ends — the
# log file is what survives. `total` is hardcoded rather than re-derived from
# the same awk pass that fills the log: deriving it from the manifest would
# let a format drift that makes awk match nothing shrink both sides together
# and pass at 0 == 0, hiding the exact failure this check exists to catch.
# 13 is the repository count `crates/claudevs/tests/corpus.rs` already
# asserts against the same manifest; bump both together if the corpus grows.
total=13
logged=0
if [ -f "$log" ]; then
  logged=$(wc -l < "$log" | tr -d ' ')
fi
if [ "$logged" -ne "$total" ]; then
  echo "corpus-fetch: manifest names $total repositories, accounted for $logged — some entry was neither cloned, cached, nor recorded unfetchable" >&2
  exit 1
fi
'''

[tasks.corpus-check]
category = "Plugin suite"
description = "Sweep the fetched third-party corpus and check it is not short (slow; needs corpus-fetch)"
# Not a dependency of `dod` and not in CI, for the reason the corpus is
# pinned rather than vendored: the clones are not in the repository, so this
# lane cannot run on a checkout alone. It is run before a release.
#
# This is the second corpus, not a replacement for the first.
# `cargo make claudevs-check` runs the hand-authored fixtures in
# crates/claudevs/tests/fixtures/ in both directions and stays exactly as it
# is: those fixtures pin the behaviour claudevs intends, and they are cheap
# and unskippable. This one answers the different question — whether that
# intent survives contact with plugins nobody here wrote.
#
# `--ignored` alone is not enough: `cargo test` exits 0 when a filter matches
# nothing, so a typo'd binary or package name here would report success
# having run zero tests. There is no flag that turns that into a failure, so
# this lane is only as safe as the runner's own tests being unskippable when
# asked for. Two guards in tests/corpus.rs carry that weight: `corpus_root()`
# asserts `target/corpus` exists at all, and
# `the_sweep_renders_one_row_per_manifest_root` additionally checks every
# repository that carries a plugin root either has a checkout on disk or was
# recorded unfetchable by `corpus-fetch`'s `.unfetchable` marker — closing the
# gap where a corpus with nothing (or only part of it) cloned would still
# render one row per manifest root and read as a clean pass.
command = "cargo"
args = ["test", "-p", "claudevs", "--test", "corpus", "--", "--ignored", "--nocapture"]

[tasks.install-airsl]
category = "Plugin suite"
description = "Install the airsl binary the plugin hooks and tests need"
# From crates.io: `airsl` and `airsl-cli` live in https://github.com/airsstack/airsl
# and are no longer members of this workspace.
#
# Deliberately unpinned. The runtime is still moving, and pinning a version here
# would mean a fix published upstream reaches this suite only when someone
# remembers to edit this line. `--locked` is a different axis: it builds whichever
# airsl-cli cargo selects against that release's own Cargo.lock, so the vendored
# Lua C sources (`lua-src`) cannot drift underneath the plugin scripts between two
# installs of the same version.
command = "cargo"
args = ["install", "airsl-cli", "--locked", "--force"]

# ---------------------------------------------------------------------------
# Development helpers
# ---------------------------------------------------------------------------

[tasks.fmt]
category = "Development"
description = "Rewrite formatting in place"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy-fix]
category = "Development"
description = "Apply the clippy suggestions that are machine-applicable"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--fix",
  "--allow-dirty",
]

[tasks.dod-crate]
category = "Development"
description = "The gate scoped to one crate: cargo make dod-crate clauders"
# While developing a single-crate change, `-p <crate>` replaces `--workspace`.
# Cross-crate changes and pre-release runs use the unscoped `dod`.
script_runner = "@shell"
script = '''
crate="${1}"
if [ -z "${crate}" ]; then
    echo "usage: cargo make dod-crate <crate-name>" >&2
    exit 1
fi
set -x
cargo fmt -p "${crate}" -- --check
cargo clippy -p "${crate}" --all-targets --all-features -- -D warnings
RUSTDOCFLAGS="-D warnings" cargo doc -p "${crate}" --all-features --no-deps
cargo test -p "${crate}" --all-targets --all-features
cargo test -p "${crate}" --all-features --doc
'''
